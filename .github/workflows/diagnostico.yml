name: Diagnostico

# roda manualmente para ver quais endpoints do Mercado Livre o app pode usar
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Opcional: o code (TG-...) do link de autorizacao do Mercado Livre"
        required: false
        default: ""

jobs:
  mercadolivre:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ferramentas/sondar_ml.py
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_CODIGO: ${{ inputs.codigo }}
