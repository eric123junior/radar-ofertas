name: Radar de ofertas

on:
  schedule:
    # a cada 15 minutos (o GitHub pode atrasar alguns minutos em horarios de pico)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar e publicar ofertas
        env:
          PALAVRAS: ${{ vars.PALAVRAS }}
          DESCONTO_MINIMO: ${{ vars.DESCONTO_MINIMO }}
          NOTA_MINIMA: ${{ vars.NOTA_MINIMA }}
          PRECO_MAXIMO: ${{ vars.PRECO_MAXIMO }}
          MAX_POR_EXECUCAO: ${{ vars.MAX_POR_EXECUCAO }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_LINK_AFILIADO: ${{ secrets.ML_LINK_AFILIADO }}
          ML_MATT_TOOL: ${{ secrets.ML_MATT_TOOL }}
          ML_MATT_WORD: ${{ secrets.ML_MATT_WORD }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          LOMADEE_APP_TOKEN: ${{ secrets.LOMADEE_APP_TOKEN }}
          LOMADEE_SOURCE_ID: ${{ secrets.LOMADEE_SOURCE_ID }}
          AWIN_FEEDS: ${{ secrets.AWIN_FEEDS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar

      # guarda o historico de precos e a vitrine no proprio repositorio
      - name: Salvar estado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # sem loja configurada nenhum desses arquivos e gerado
          for f in estado/radar.db site/ofertas.json OFERTAS.md; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "radar: atualiza ofertas" -q
          git push -q

      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLICAR_PAGES == 'true'
        with:
          path: site

  # publica a vitrine no GitHub Pages; ligue com a variavel PUBLICAR_PAGES=true
  # depois de ativar Settings > Pages > Source: GitHub Actions
  vitrine:
    needs: rodar
    if: vars.PUBLICAR_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
